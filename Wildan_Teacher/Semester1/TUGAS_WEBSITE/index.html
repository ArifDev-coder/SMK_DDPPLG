<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <title>ArifDev</title>

    <style>
      * {
        margin: 0;
      }

      a {
        color: #d92323;
      }

      a:hover {
        font-family: Persona-5-Menu;
        color: #efefef;
      }

      .submit-button {
        border-radius: 16px;
        background-color: #efefef;
        color: #0d0d0d;
        transition: 0.2s ease-in-out;
      }

      .submit-button:hover {
        scale: 110%;
        border-radius: 5px;
        background-color: #d92323;
        color: #efefef;
      }

      .bg {
        height: 100vh;
        background-image: url("src/global/waw.jpeg");
        background-repeat: no-repeat;
        background-size: cover;
      }

      .container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-family: Poppins;
        background-color: rgba(0, 0, 0, 0.7);
      }



      @font-face {
        font-family: "Persona-5-Main";
        src: url("src/font/Persona5main.ttf") format("truetype");
      }

      @font-face {
        font-family: "Persona-5-Expose";
        src: url("src/font/Expose-Regular.otf") format("opentype");
      }

      @font-face {
        font-family: "Persona-5-Menu";
        src: url("src/font/Persona5MenuFontPrototype-Regular.ttf")
          format(truetype);
      }
    </style>
  </head>
  <body>
    <div class="bg">
      <div class="container">
        <table
          border="1"
          cellspacing="0"
          align="center"
          style="
            width: 60%;
            height: 600px;
            background-color: #0d0d0d;
            color: #efefef;
            border-color: #d92323;
            margin-top: 1.4rem;
            margin-bottom: 2rem;
          "
        >
          <tr>
            <td colspan="5">
              <table style="width: 100%" cellpadding="10">
                <tr>
                  <td
                    style="
                      width: 100%;
                      font-size: 1.8rem;
                      font-family: Persona-5-Main;
                    "
                  >
                    <b>ArifDev</b>
                  </td>
                  <td align="center" style="font-family: Persona-5-Expose">
                    <a href="#">Home</a>
                  </td>
                  <td align="center" style="font-family: Persona-5-Expose">
                    <a href="./page/about.html">About</a>
                  </td>
                  <td align="center" style="font-family: Persona-5-Expose">
                    <a href="./page/gallery.html">Gallery</a>
                  </td>
                  <td align="center" style="font-family: Persona-5-Expose">
                    <a href="./page/contact.html">Contact</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td>
              <table cellpadding="10">
                <tr>
                  <th colspan="2">Selamat Datang di My Website Gwe Aku</th>
                </tr>

                <tr>
                  <td rowspan="2" style="width: 20%">
                    <img
                      src="src/home/jokerwithgun.jpeg"
                      width="250px"
                      style="border-radius: 1rem"
                    />
                  </td>
                  <td valign="top">
                    <p>
                      Website ini di buat dengan penuh 
                    </p>
                    <a href="https://youtube.com" target="_blank"
                      >Pelajari Lebih Lanjut >></a
                    >
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td align="center">Made by ArifDev</td>
          </tr>
        </table>
      </div>
    </div>
  </body>
</html>

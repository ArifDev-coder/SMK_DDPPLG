<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HENAP</title>
  </head>
  <body style="display: flex; flex-direction: column; align-items: center">
    <table
      width="500"
      cellspacing="0"
      style="
        border: 1px solid black;
        border-radius: 0.5rem;
        font-family: Arial, Helvetica, sans-serif;
      "
    >
      <caption>
        Registrasi Akun
      </caption>

      <tr>
        <th
          style="
            border-bottom: 1px solid black;
            background-color: #c0c0c0;
            border-radius: 0.5rem 0.5rem 0rem 0rem;
          "
        >
          <h2>REGISTRASI AKUN BARU</h2>
        </th>
      </tr>

      <tr>
        <td>
          <form action="">
            <table width="100%" cellspadding="3">
              <tr>
                <td>Nama Lengkap</td>
                <td><input type="text" size="" /></td>
              </tr>

              <tr>
                <td>Email</td>
                <td><input type="email" /></td>
              </tr>

              <tr>
                <td>Hobi</td>
                <td>
                  <input type="checkbox" id="coding" />
                  <label for="coding">Coding</label>

                  <input type="checkbox" id="gaming" />
                  <label for="gaming">Gaming</label>

                  <input type="checkbox" id="reading" />
                  <label for="reading">Reading</label>
                </td>
              </tr>

              <tr>
                <td>ALamat</td>
                <td><textarea name="alamat" id="alamat" cols=""></textarea></td>
              </tr>

              <tr>
                <td>Upload Foto</td>
                <td><input type="file" /></td>
              </tr>

              <tr>
                <td colspan="3">
                  <hr />
                </td>
              </tr>

              <tr>
                <td align="center" colspan="2">
                  <input type="checkbox" id="setuju" />
                  <label for="setuju"
                    >Saya menyetujui syarat & ketentuan.</label
                  >
                </td>
              </tr>

              <tr>
                <td colspan="3" align="center">
                  <button
                    type="button"
                    value="Daftar Akun"
                    style="
                      width: 12rem;
                      height: 1.8rem;
                      font-size: 1rem;
                      font-family: Arial, Helvetica, sans-serif;
                    "
                  >
                    Daftar Akun
                  </button>
                </td>
              </tr>
            </table>
          </form>
        </td>
      </tr>
    </table>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body style="font-family: Arial, Helvetica, sans-serif">
    <marquee behavior="alternate" direction="left">
      <h2>MATERI TABEL PADA HTML</h2>
    </marquee>

    <table
      border="1"
      align="center"
      cellspacing="0"
      cellpadding="5"
      style="font-size: 1.2rem; text-align: center"
    >
      <caption align="top">
        <b>Daftar Harga</b>
      </caption>

      <tr>
        <th>Nama Barang</th>
        <th>Kategori</th>
        <th>Harga Satuan</th>
        <th>Jumlah Barang</th>
        <th>Total</th>
      </tr>

      <tr>
        <td>Keyboard</td>
        <td rowspan="2">Tools</td>
        <td>Rp90.000</td>
        <td>4</td>
        <td>Rp360.000</td>
      </tr>

      <tr>
        <td>Mouse</td>
        <td>Rp50.000</td>
        <td>5</td>
        <td>Rp250.000</td>
      </tr>

      <tr>
        <td>USB 8GB</td>
        <td rowspan="2">Utility</td>
        <td>Rp60.000</td>
        <td>2</td>
        <td>Rp120.000</td>
      </tr>

      <tr>
        <td>CD Blank</td>
        <td>Rp5.000</td>
        <td>10</td>
        <td>Rp50.000</td>
      </tr>

      <tr>
        <td colspan="4">Total</td>
        <td>Rp780.000</td>
      </tr>
    </table>
  </body>
</html>
